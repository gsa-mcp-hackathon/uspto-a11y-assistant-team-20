[project]
name = "alt-text-mcp"
version = "0.1.0"
description = "Starter MCP server for the GSA MCP hackathon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
# Lets you run the server with `uv run alt-text-mcp`.
alt-text-mcp = "alt_text_mcp.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alt_text_mcp"]

[dependency-groups]
# Dev deps. Install with `uv sync --group dev`.
#
# The Phoenix evaluation harness (eval/phoenix/) deliberately does NOT add its
# deps here: langchain-mcp-adapters requires mcp<2.0.0, while this server's own
# fastmcp>=2.0.0 requires mcp>=2.0.0 — those can't coexist in one venv. The
# harness gets its own isolated environment; see eval/phoenix/README.md.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", ".agents"]
# Don't reformat Python code fences inside Markdown docs (they're illustrative
# snippets, not runnable modules).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# server.py embeds its chat UI as one long HTML/CSS/JS string constant
# (_INDEX_HTML) — an 88-char Python line limit isn't meaningful for markup
# and script inside that string, so E501 is ignored for this file only.
"deploy/databricks/agent-app/server.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
